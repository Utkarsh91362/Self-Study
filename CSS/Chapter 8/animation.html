<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .container {
            height: 100vh;
            width: 100vw;
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .box {
            width: 3vw;
            height: 3vw;
            
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            /* animation-name: widthAnimate;
            animation-duration: 2s;
            animation-delay: 2s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            animation-timing-function: cubic-bezier(.77,0,.18,1); */
            animation: widthAnimate2 2s cubic-bezier(0.77, 0, 0.18, 1)  infinite alternate ;
            
        }
        @keyframes widthAnimate2{
            0%{
                width: 3vw;
                height: 3vw;
            }
            30%{
                width: 15vw;
                height: 15vw;
            }
            60%{
                width: 45vw;
                height: 45vw;
            }
            100%{
                width: 60vw;
                height: 60vw;
            }
           
        /* @keyframes widthAnimate{
            from{
                width: 3px;
                height: 3px;
            }
            to{
                width:60vw;
                height: 60vh;
            } */
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="img3.png" alt="" class="box">
    </div>
</body>

</html>
