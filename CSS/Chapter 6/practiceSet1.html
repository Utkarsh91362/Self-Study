<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul {
            padding: 34px;
        }

        li {
            list-style: none;
            display: inline;
            padding: 0px 34px;


        }

        header {
            background-color: black;
            color: white;

        }

        .left {
            float: left;
            height:50vh;
            background-color: red;
            color: white;
            width: 49vw;

        }

        .right {
            float: right;
            height: 50vh;
            width: 49vw;
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <div class="Container">
        <div class="left">This is left box</div>
        <div class="right">This is right box</div>

    </div>
</body>

</html>
