<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display:flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: flex-start;
            background-color: aqua;
            height: 100vh;
            align-items: center;
            /* align-content: center; */
            
        }
        .box1 {
            height: 234px;
            /* width: 345px; */
            background-color: blue;
            border: 2px solid white;
            order: 3;
            /* align-self: flex-end; */
            flex-grow: 2;
            
            
        }
        
        .box2 {
            height: 234px;
            /* width: 345px; */
            background-color: red;
            border: 2px solid white;
            order: 5;
            flex-grow: 1;
            
        }
        .box3 {
            height: 234px;
            /* width: 345px; */
            background-color: red;
            border: 2px solid white;
            order: 1;
            flex-grow: 1;
            
        }
        .box4 {
            height: 234px;
            /* width: 345px; */
            background-color: red;
            border: 2px solid white;
            order: 2;
            flex-grow: 1;
            
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
    </div>
</body>

</html>
