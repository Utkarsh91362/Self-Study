<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: red;
        }
        div{
            background-color: antiquewhite;
        }
        #red{
            background-color: aquamarine;
            
        }
        .blue,h3{
            background-color: green;
            color: white;
            border: 2px solid black;
        }
        *{
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div>
        <h1>This is my CSS Selector Page</h1>
        <p>
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ratione minus hic reiciendis quisquam temporibus harum dolore, sapiente et, unde facilis at, illo error quo enim.
        </p>
    </div>
    <div id="red">
        
        <h1>This is another h1</h1>
    </div>
    <span class="blue">First tag</span>
    <span class="blue">Second tag</span>
    <span class="blue">Third tag</span>
    <div>
        <h3>This is h3</h3>
    </div>
</body>
</html>
