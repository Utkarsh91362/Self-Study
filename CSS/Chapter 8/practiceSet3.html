<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 3</title>
    <style>
        .container{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img{
            animation: rotate 10s ease-in  infinite forwards ;
        }
        @keyframes rotate{
            0%{
                transform: rotate(0deg);
            }
            
            100%{
                transform: rotate(360deg);
            }
        }
        
    </style>
</head>
<body>
    <div class="container"><img src="img3.png" alt=""></div>
        
</body>
</html>
