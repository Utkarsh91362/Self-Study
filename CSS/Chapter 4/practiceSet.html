<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prectice Set</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:slnt,wght,CRSV,ELSH,ELXP@-8,301,0..1,13.8,90&family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .nav {
            height: 50px;
            background-color: black;
            color: wheat;
            /* text-align: center; */


        }

        .left {
            height: 90vh;
            background-color: red;
            color: wheat;
            width: 50%;
            display: inline-block;
            text-align: center;
            /* display: none; */
            /* visibility: hidden; */

        }
        .nav ul li{
            display: inline-block;
            margin: 12px 30px;
        }
        .nav ul li a{
            color: wheat;

            font-variation-settings:
                "slnt" -8,
                "CRSV" 1,
                "ELSH" 13.8,
                "ELXP" 0;
            text-transform: capitalize;

        }
