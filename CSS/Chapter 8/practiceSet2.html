<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .progress{
            width: 3px;
            height: 3px;
            transition: width .45s .18s ease-in-out;
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="progress" id="Progress"></div>
    <button id="btn">Start</button>
</body>
<script>
    btn.addEventListener("click",()=>{
        const starting=getComputedStyle(Progress).width
        if(starting=='3px'){
            Progress.style.width='100vw'
        }else{
            Progress.style.width='3px'
        }
    })
</script>
</html>
